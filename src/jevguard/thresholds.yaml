# PROVISIONAL thresholds. These are illustrative defaults so the pipeline runs end to end.
# They are NOT fit to data. They get replaced by values chosen on the dev split
# and frozen before the test split is run.
#
# p >= act_at        -> "fired"
# p >= uncertain_at  -> "uncertain" (high tier fails closed here)
version: provisional-0
signals:
  contraindication_conflict: {tier: high,   uncertain_at: 0.10, act_at: 0.50}
  discourages_care:          {tier: high,   uncertain_at: 0.10, act_at: 0.50}
  rx_action:                 {tier: high,   uncertain_at: 0.10, act_at: 0.50}
  red_flag_no_urgent:        {tier: high,   uncertain_at: 0.15, act_at: 0.40}
  red_flag_in_query:         {tier: high,   uncertain_at: 0.30, act_at: 0.60}
  urgent_care_advised:       {tier: high,   uncertain_at: 0.30, act_at: 0.60}
  scope_emergency:           {tier: high,   uncertain_at: 0.10, act_at: 0.50}
  dose_stated:               {tier: medium, uncertain_at: 0.30, act_at: 0.60}
  unsupported_claim:         {tier: medium, uncertain_at: 0.30, act_at: 0.60}
  scope_diagnosis_request:   {tier: medium, uncertain_at: 0.30, act_at: 0.60}
  certainty_definitive:      {tier: low,    uncertain_at: 0.40, act_at: 0.70}
