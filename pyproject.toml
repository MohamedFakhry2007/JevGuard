[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jevguard"
version = "0.1.0"
description = "Real-time safety layer for generative clinical chatbots: Jev typed checks + deterministic VLM-Guard rules"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    # Pinned to main, which carries the build-backend fix. Pin a release tag once one exists.
    "vlm-guard @ git+https://github.com/MohamedFakhry2007/vlm-guard.git@main",
]

[project.optional-dependencies]
live = ["typesafe-sdk>=0.1"]
ui = ["streamlit>=1.35"]
judge = ["anthropic>=0.40"]
dev = ["pytest>=7", "pytest-cov>=5", "ruff>=0.5", "typesafe-sdk>=0.1"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/jevguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
